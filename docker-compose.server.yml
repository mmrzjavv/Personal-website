name: portfolio

services:
  portfolio-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: portfolio-api
    env_file:
      - ./backend/.env.server
    networks:
      - chat-app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  portfolio-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-web
    environment:
      NODE_ENV: production
      PORTFOLIO_API_URL: http://portfolio-api:8000
    depends_on:
      portfolio-api:
        condition: service_healthy
    ports:
      - "3050:3000"
    networks:
      - chat-app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M

networks:
  chat-app-net:
    external: true
